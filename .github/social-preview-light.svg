<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="mbedfx : social links that embed properly">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#5865f2" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#3d48c8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#ffffff"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!--
    THE MARK: a rounded tile with the "fx" wordmark, matching the site's own header badge.

    CENTRED AT 584, NOT 512 (fixed 2026-09-12). The tile is 112 wide on a 1280 canvas, so its left
    edge belongs at (1280-112)/2 = 584 and its centre lands on 640 — the same axis every text line
    below already uses. It sat at 512 from the first commit, putting its centre at 568: SEVENTY-TWO
    PIXELS, 5.6% of the width, left of everything else on the card.

    THAT is the "the mark is off centre" report, and it had been misread twice. Both previous
    attempts measured the GLYPH inside the tile — 0.75px in one, an alpha-weighted centroid in the
    other — found sub-pixel errors, corrected them, and shipped, while the tile they were measuring
    inside stayed 72px off. A measurement can only ever answer the question it was pointed at, and
    neither was pointed at the tile.

    THE GLYPH IS LIVE TEXT AGAIN, and the PNG that replaced it is gone. It was baked because the
    mark "depended on system-ui, which is not embedded, so every viewer rendered it in a different
    font" — but that diagnosis was for the wrong defect, and the bake bought less than it cost:

      - It was 3,069 bytes of base64, 51% of this file, for two letters.
      - It made the card LESS consistent, not more: the wordmark below is live system-ui text, so a
        Windows reader got an Apple-rendered tile above a Segoe UI wordmark.
      - The site's own badge, the thing this comment says the tile matches, is live text too
        (`.avatar` / `.msg .ava` in public/index.html, centred with `place-items: center`).

    WHAT WAS ACTUALLY FONT-DEPENDENT was the pre-bake `y="74"` — a baseline hand-tuned to one font's
    metrics. `text-anchor="middle"` already made the horizontal axis font-independent (a52dc2b's own
    comment says so, while arguing for keeping the wordmark as text); the vertical axis just needed
    the same treatment rather than a raster. `dominant-baseline="central"` asks the RENDERER to
    centre on the font it actually has, so there is no hardcoded metric left to be wrong.
  -->
  <g transform="translate(584 148)">
    <rect width="112" height="112" rx="30" fill="url(#tile)"/>
    <text x="56" y="56" text-anchor="middle" dominant-baseline="central"
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">fx</text>
  </g>

  <text x="640" y="360" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="104" font-weight="900" letter-spacing="-3">
    <tspan fill="#14141a">mbedfx</tspan><tspan fill="#5865f2">.app</tspan>
  </text>

  <text x="640" y="424" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="30" font-weight="500" fill="#5c5e66">
    Social links that embed properly
  </text>

  <text x="640" y="486" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" fill="#8b8b94">
    17 sites · native extraction · no accounts
  </text>

  <rect x="0" y="628" width="1280" height="12" fill="#5865f2"/>
</svg>
