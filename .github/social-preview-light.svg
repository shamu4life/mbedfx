<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="mbedfx — social links that embed properly">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="52%">
      <stop offset="0%" stop-color="#5865f2" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#5865f2" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5865f2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5865f2"/>
      <stop offset="100%" stop-color="#3d48c8"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="#ffffff"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- The mark: a rounded tile with the "fx" wordmark, matching the site's own header badge. -->
  <g transform="translate(512 148)">
    <rect width="112" height="112" rx="30" fill="url(#tile)"/>
    <text x="56" y="74" text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">fx</text>
  </g>

  <text x="640" y="360" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="104" font-weight="900" letter-spacing="-3">
    <tspan fill="#14141a">mbedfx</tspan><tspan fill="#5865f2">.app</tspan>
  </text>

  <text x="640" y="424" text-anchor="middle"
        font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="30" font-weight="500" fill="#5c5e66">
    Social links that embed properly
  </text>

  <text x="640" y="486" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="21" fill="#8b8b94">
    17 sites · native extraction · no accounts
  </text>

  <rect x="0" y="628" width="1280" height="12" fill="#5865f2"/>
</svg>
