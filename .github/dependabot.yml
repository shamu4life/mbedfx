# Dependency updates. Two ecosystems: the npm packages (wrangler, typescript,
# @cloudflare/workers-types as dev; @cloudflare/containers at RUNTIME — the last is why calling
# these "devDependencies" was wrong) and the GitHub Actions used by CI. Monthly rather than
# weekly: there are four direct packages and a weekly cadence would be noise.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels: ["dependencies"]
