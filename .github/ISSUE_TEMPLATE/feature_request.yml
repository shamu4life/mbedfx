name: Feature request
description: Suggest a site, a card improvement, or something the converter should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: >
        What problem or limitation does this address?
        "I want X" is less useful than "When I do Y, I can't Z because…"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true

  - type: input
    id: example
    attributes:
      label: An example link
      description: >
        If this is about a site or a post shape we do not handle yet, a real link is worth
        more than a description of one, and it is what the work gets tested against.
      placeholder: "https://example.com/some/post/123"
    validations:
      required: false

  - type: textarea
    id: scope
    attributes:
      label: Scope notes
      description: >
        Optional. Flag anything that affects scope. This project does its own extraction, so
        "route it to another fixer" is out of scope by design. Anything needing an account, a
        login, or a paid API is very likely out too, because a reader should be able to paste a
        link and have it work with nobody signed in to anything.
    validations:
      required: false
