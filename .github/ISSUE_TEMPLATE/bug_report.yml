name: Bug report
description: A card is wrong, missing, or a link will not resolve
labels: [bug]
body:
  - type: input
    id: link
    attributes:
      label: The link
      description: >
        The mbedfx link that misbehaved, and the original if it differs. This is the single
        most useful thing in the report, since most bugs here are one specific post, not a whole site.
      placeholder: "https://mbedfx.app/@user/video/7660566211100511518"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Which deployment?
      options:
        - mbedfx.app or another official domain
        - My own copy on Cloudflare (Workers Paid)
        - My own copy on Cloudflare (wrangler.free.jsonc)
        - My own copy on the Node adapter or Docker Compose
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit (your own copy only)
      placeholder: "v1.17.0"
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did the card show, or not show?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true

  - type: dropdown
    id: site
    attributes:
      label: Which site is the post on?
      options:
        - Twitter
        - TikTok
        - Instagram
        - Threads
        - Reddit
        - Bluesky
        - YouTube
        - Facebook
        - Twitch
        - Pinterest
        - Dailymotion
        - Streamable
        - Imgur
        - Mastodon / Misskey / Lemmy / PeerTube (fediverse)
        - The converter page itself
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where did you see it?
      options:
        - Discord
        - The converter page preview
        - Telegram
        - Somewhere else
    validations:
      required: true

  - type: checkboxes
    id: still-broken
    attributes:
      label: Does it still happen?
      description: >
        Cards are cached for about 15 minutes. A cold video shows its cover in the first
        message for good, and Discord keeps its own copy of a link's card for about 30 minutes,
        so check again with a new paste after that, or in the converter page's preview.
      options:
        - label: I checked again with a new paste after 30 minutes, or in the converter preview, and it still happens
          required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: >
        A screenshot of the card is worth a lot. If the post is private, age-gated, or has
        since been deleted, say so, because that changes what the right answer is.
    validations:
      required: false
