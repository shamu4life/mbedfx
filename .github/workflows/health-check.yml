# Look for breaks twice a week and say so in an issue, because the half-hourly check never told anyone.
#
# WHY IT EXISTS. src/smoke.ts has rendered one known post per platform every 30 minutes since 2026-08-12
# and counted the verdicts, and nobody read them unprompted. When somebody finally did, on 2026-10-14,
# TikTok had failed on almost every tick for a week, Instagram on about half (and roughly a third of real
# Instagram pastes with it), all without a word. The owner asked for a check "on a weekly or twice weekly
# basis" that looks for breaks.
#
# WHAT IT READS. `/_health`, the scheduled check's own last seven days (src/health.ts: kept in R2 by the
# Worker, so no Cloudflare credential is needed here; owner's call over a read-only API token, 2026-10-14).
# Then, from GitHub's network: `/_smoke` twice a minute apart, `/_clients` (the video container), and both
# guest domains with their `d.` names. What counts as broken, and the thresholds, are in
# .github/scripts/health-lib.mjs and pinned by test/health-check.test.mjs.
#
# WHAT IT WRITES. Issues labelled `health-check`: one per problem, a comment on it every run while it stays
# broken, closed when it passes again, and closed only by a run that could check it (a run that cannot
# read `/_health` leaves the check issues open). It never touches code, branches, PRs or deploys.
#
# ON THE BOT IDENTITY, because CLAUDE.md locks this repo to the `shamu4life` account. The issues are opened
# by github-actions[bot] through GITHUB_TOKEN, and that is the owner's call (2026-10-14), chosen over an
# email-only variant and a Discord webhook, knowing it widens the exception ytdlp-freshness.yml holds. It
# is narrow by construction: this job may only create, comment on and close issues carrying the
# `health-check` label (and create that label). CLAUDE.md's Identity section records both jobs.
#
# A RED RUN MEANS THE CHECK ITSELF BROKE (it crashed, or `gh` refused), never that a platform did; that is
# what the issues are for. GitHub disables scheduled workflows after 60 days with no repository activity,
# and emails before it does: re-enable it under Actions if the repo goes quiet.
name: health-check

on:
  schedule:
    # Mondays and Thursdays, 13:23 UTC (09:23 Eastern in summer, 08:23 in winter). Off the hour on
    # purpose, as ytdlp-freshness.yml is: jobs scheduled on the hour queue behind everybody else's.
    - cron: "23 13 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Check mbedfx and file issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/health-check.mjs --file-issues
