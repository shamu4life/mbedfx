# Tests and typecheck. THIS WORKFLOW DOES NOT DEPLOY — read the next paragraph before adding a
# deploy step back.
#
# DEPLOYS BELONG TO CLOUDFLARE WORKERS BUILDS (connected to this repo in the Cloudflare dashboard,
# 2026-07-26). It watches main and pushes to the apex itself. An earlier version of this file also
# ran `wrangler deploy` on push to main, which would mean TWO systems deploying the same worker from
# the same commit: they race on the container image and on which version ends up live, and the loser
# silently overwrites the winner. One deployer, always.
#
# WHAT THAT COST, AND HOW IT CAME BACK. When this file owned the deploy, tests ran BEFORE any
# Cloudflare credential was used, so a red suite could not ship. This workflow reports a failure
# without being able to BLOCK a deploy, so the gate now lives in Workers Builds itself. As set in the
# Cloudflare dashboard (2026-11-25):
#
#     build command:   npm run build                                       (tests + typecheck)
#     deploy command:  npx wrangler deploy -c wrangler.production.jsonc    (main)
#     preview command: npx wrangler preview -c wrangler.production.jsonc   (other branches)
#
# THE -c IS LOAD-BEARING. The root wrangler.jsonc is the generic self-host config. Workers Builds
# replaces a config's Worker name with the connected Worker's, so a deploy command without -c puts the
# generic file onto the production Worker: workers.dev turns on, the bindings point at the generic
# bucket and dataset, and the container application name it derives is not the one MediaResolver is
# attached to, which fails the container half of the deploy.
#
# That matters more here than on a typical worker: this one is the origin for og:video urls that
# Discord CACHES on first fetch, keyed by a url that does not change. A bad deploy is not "revert and
# move on" — it is a poisoned cache entry that outlives the fix.
name: ci

on:
  push:
    # main only. The repo was consolidated to a single remote branch on 2026-08-28, and a
    # trigger naming a second one reads as an invitation to create it.
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No network, no container, no R2 — the whole suite runs on captured bytes and fake bindings.
      - name: Test
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit

      # THE CONTAINER'S PYTHON, EXECUTED. The Node suite above reads container/server.py as TEXT and
      # asserts on substrings, which can confirm a line exists but not what it produces — that is how a
      # cookie jar spliced into the middle of `-o <out>` passed every gate and was left armed to break
      # on the day credentials were added. This step runs the SSRF gate and the yt-dlp argv builders for
      # real, with subprocess stubbed. It lives here and not in `npm run build` because that script is
      # also the Workers Builds deploy gate, where python3 is not guaranteed.
      - name: Container tests
        run: npm run test:container
